<script>
  import { signal } from 'jamrock';
  
  let todos = signal([]);
  let input = signal('');
  let filter = signal('all');
  
  function addTodo() {
    const text = input.value.trim();
    if (text) {
      todos.value = [...todos.value, { 
        id: Date.now(), 
        text: text, 
        done: false 
      }];
      input.value = '';
    }
  }
  
  function toggleTodo(id) {
    todos.value = todos.value.map(t => 
      t.id === id ? { ...t, done: !t.done } : t
    );
  }
  
  function removeTodo(id) {
    todos.value = todos.value.filter(t => t.id !== id);
  }
  
  function clearDone() {
    todos.value = todos.value.filter(t => !t.done);
  }
  
  function onInput(e) {
    input.value = e.value;
  }
</script>

<vstack>
  <label>📝 Todo App</label>
  <label>─</label>
  
  <hstack>
    <entry placeholder="Add a todo..." onchange={onInput} />
    <button onclick={addTodo}>Add</button>
  </hstack>
  
  <label>─</label>
  
  <label>Todos: {$todos.length}</label>
  
  <label>─</label>
  
  {#each $todos as todo}
    <hstack>
      <button onclick={() => toggleTodo(todo.id)}>{todo.done ? '✓' : '○'}</button>
      <label>{todo.text}</label>
      <button onclick={() => removeTodo(todo.id)}>✕</button>
    </hstack>
  {/each}
</vstack>
