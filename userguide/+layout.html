<style global lang="less">
  @import './lib/styles.less';
</style>

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="HandheldFriendly" content="true" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no"
  />
  <meta name="release" content="{process.env.GIT_REVISION}" />
  <link rel="stylesheet" href="//unpkg.com/highlight.js@10.7.3/styles/tomorrow.css" inline />
  <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Montserrat" inline />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />
</head>

<body class="reset">
  <main class="body min">
    <div class="center">
      <a class="welcome" href="/welcome">
        <svg src="./images/welcome.svg" height="32" />
      </a>
      <h1 class="meteorite floating">
        <a href="/" data-version="{process.env.GIT_REVISION}">
          <svg src="./images/jamrock-meteorite.svg" size="420" />
        </a>
      </h1>
    </div>
    {@render $$props.children?.()}
  </main>
</body>
