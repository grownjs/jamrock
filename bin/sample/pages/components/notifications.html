<script context="client">
  import { signal, effect } from 'jamrock';

  let messages = [];
  export { messages as from };

  const msgs = signal(messages);

  function close(offset) {
    msgs.value = msgs.value.filter((_, i) => i !== offset);
  }

  function pop() {
    if (!msgs.value.length) return;
    msgs.value = [...msgs.value.slice(0, -1)];
  }

  effect(() => {
    const t = setInterval(pop, 5000);
    return () => clearInterval(t);
  });
</script>

{#each msgs.value as msg, i}
  <li class={msg.type}>{msg.value} <button onclick="{() => close(i)}">&times;</button></li>
{/each}
