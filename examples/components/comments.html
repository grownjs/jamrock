<script>
  import Comments from './comments.html';
  export const data = [];
  export const key = 0;

  function save({ params }) {
    for (const c of data) {
      if (c.id === +params.message_id) {
        c.count = (c.count || 0) + 1;
        c.msgs = c.msgs || [];
        c.msgs.unshift({ id: Date.now(), body: params.message, count: 0, msgs: [] });
        break;
      }
    }
  }
</script>

<style>
  ul { list-style-type: none; padding-left: 20px }
</style>

<ul>
  <fragment name="live-comments" key="comments:{key}">
    {#each data as c}
      <li>
        <fieldset>
          <p>{c.body}</p>
          <form @patch @async on:submit={save}>
            <input type="hidden" name="message_id" value={c.id} />
            <input type="text" name="message" />
            <button>Reply</button>
          </form>
          {#if c.count > 0}
            <Comments data={c.msgs} key="{key}.{c.id}" />
          {/if}
        </fieldset>
      </li>
    {/each}
  </fragment>
</ul>
