<script context="module">
  const _comments = [
    {
      id: 1,
      body: 'Great post!',
      count: 2,
      msgs: [
        { id: 2, body: 'I agree!', count: 0, msgs: [] },
        { id: 5, body: 'Thanks!', count: 0, msgs: [] },
      ],
    },
    { id: 6, body: 'Can you explain more?', count: 0, msgs: [] },
  ];

  export function addComment(payload) {
    const parent_id = +payload.message_id;
    const message = payload.message;

    function find_and_add(comments) {
      for (const c of comments) {
        if (c.id === parent_id) {
          c.count = (c.count || 0) + 1;
          c.msgs = c.msgs || [];
          c.msgs.unshift({ id: Date.now(), body: message, count: 0, msgs: [] });
          return true;
        }
        if (c.msgs && find_and_add(c.msgs)) return true;
      }
      return false;
    }

    find_and_add(_comments);
  }

  export function incrementLikes(payload) {
    const comment_id = +payload.comment_id;

    function find_and_like(comments) {
      for (const c of comments) {
        if (c.id === comment_id) {
          c.likes = (c.likes || 0) + 1;
          return true;
        }
        if (c.msgs && find_and_like(c.msgs)) return true;
      }
      return false;
    }

    find_and_like(_comments);
  }
</script>

<script>
  import Comments from './comments.html';
  export const data = _comments;
  export const key = 0;
</script>

<style>
  ul { list-style-type: none; padding-left: 20px }
  p { margin: 0.3em 0; }
  fieldset { border: none; padding: 0; }
  .reply-form { display: flex; gap: 0.4em; align-items: center; margin: 0.3em 0; }
  .reply-form input[type=text] { flex: 1; padding: 0.3em; font-size: 0.85em; }
  .reply-form button { padding: 0.3em 0.7em; font-size: 0.85em; }
  .reply-toggle { cursor: pointer; background: none; border: none; color: #79C551; font-size: 0.85em; padding: 2px 0; }
  .reply-toggle:hover { text-decoration: underline; }
</style>

<ul>
  <fragment name="live-comments" key="comments:{key}">
    {#each data as c}
      <li>
        <fieldset>
          <p>{c.body}</p>
          <form class="reply-form" rpc:call={addComment}>
            <input type="hidden" name="message_id" value={c.id} />
            <input type="text" name="message" />
            <button type="submit">Reply</button>
          </form>
          <button class="like-btn" rpc:call={incrementLikes} value={c.id} name="comment_id">Like ({c.likes || 0})</button>
          {#if c.count > 0}
            <Comments data={c.msgs} key="{key}.{c.id}" />
          {/if}
        </fieldset>
      </li>
    {/each}
  </fragment>
</ul>
