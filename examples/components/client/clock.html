<script context="client">
  import { signal, effect } from 'jamrock';

  const now = signal(Date.now());

  effect(() => {
    const timer = setInterval(() => {
      now.value = Date.now();
    }, 1000);
    return () => clearInterval(timer);
  });
</script>

{new Date(now.value).toISOString().substr(11, 8)}
