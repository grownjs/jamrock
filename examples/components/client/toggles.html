<script context="client">
  import { useState, useEffect } from "jamrock";

  export const names = [];
  export const prefix = "check-";
  export const checked = 0;

  // FIXME: focus vs selection?
  const [selected, setTab] = useState(checked);

  function prevTab() {
    if (selected > 0) setTab(selected - 1);
  }
  function nextTab() {
    if (selected < names.length - 1) setTab(selected + 1);
  }
  function updateTab() {
    requestAnimationFrame(() => {
      const tabs = self.querySelectorAll("[role=tab]");
      const tab = self.querySelector("[role=tab]:focus");

      if (!tab) return;

      let offset = 0;
      for (let i = 0; i < tabs.length; i++) {
        if (tabs[i] === tab) break;
        offset++;
      }
      setTab(offset);
    });
  }
  function selectTab() {
    self.querySelector("[aria-selected=true] label").click();
  }

  useEffect(() => {
    setTimeout(() => self.querySelector("[aria-selected=true]").focus(), 60);
  }, [selected]);
</script>

<style>
  li {
    transition: background-color .2s;
  }
  li[aria-selected] {
    font-weight: bold;
    background-color: #fff !important;
  }
</style>

{#each names as tab, i}
<li aria-selected="{selected === i ? 'true' : null}" role="tab" tabindex="0">
  <label for="{prefix}{i}" on:click="{() => setTab(i)}">{tab}</label>
</li>
{/each}
