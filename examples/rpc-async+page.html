<script context="module">
let serverCount = 0;

export async function increment(step = 1) {
  serverCount += step;
  return { count: serverCount };
}

export async function decrement(step = 1) {
  serverCount -= step;
  return { count: serverCount };
}

export async function reset() {
  serverCount = 0;
  return { count: serverCount };
}
</script>

<h1>RPC Test</h1>

<p>Server count: <span id="server-count">{serverCount}</span></p>

<form @on:submit={increment}>
<button type="submit" id="increment">+1 Server</button>
</form>

<form @on:submit={decrement}>
<button type="submit" id="decrement">-1 Server</button>
</form>

<form @on:submit={reset}>
<button type="submit" id="reset">Reset</button>
</form>
