<script context="module">
let serverCount = 0;

export async function increment(step = 1) {
  serverCount += step;
  return { count: serverCount };
}

export async function decrement(step = 1) {
  serverCount -= step;
  return { count: serverCount };
}

export async function reset() {
  serverCount = 0;
  return { count: serverCount };
}
</script>

<h1>RPC Test</h1>

<p>Server count: <span test:id="server-count">{serverCount}</span></p>

<form @on:submit={increment}>
<button type="submit" test:id="increment">+1 Server</button>
</form>

<form @on:submit={decrement}>
<button type="submit" test:id="decrement">-1 Server</button>
</form>

<form @on:submit={reset}>
<button type="submit" test:id="reset">Reset</button>
</form>

<hr />

<h2>Fragment counter (SSE patch)</h2>
<fragment name="counter">
  <span test:id="fragment-count">{serverCount}</span>
  <form rpc:call={increment}><button type="submit" test:id="fragment-increment">+1</button></form>
  <form rpc:call={decrement}><button type="submit" test:id="fragment-decrement">-1</button></form>
  <form rpc:call={reset}><button type="submit" test:id="fragment-reset">Reset</button></form>
</fragment>
